<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Playwrite+PE:wght@100..400&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap');
    </style>
    <title>Spotify - Your best ones are here</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <ul>
            <li class="brand"><img src="./img/Spotify.jpg" alt="Spotify"> Spotify</li>
            <li>Home</li>
            <li>About</li>
        </ul>
    </nav>

    <div class="container">
        <div class="songlist">
            <h1>Top 10 Songs</h1>
            <div class="songItemContainer">
                <div>
                <div class="songItem">
                    <img src="./img/apocalypsecover.jpg" alt="cover image">
                    <span>Apocalypse</span> <!--  to get in one line -->
                    <span class="songlistPlay"><span class="timestamp">04:50</span><span><i id="0" class="fa-solid songItemplay fa-play"></i></span></span>
                </div>
                <div class="songItem">
                    <img src="./img/SweaterWeathercover.jpg" alt="cover image">
                    <span>Sweater Weather</span> <!--  to get in one line -->
                    <span class="songlistPlay"><span class="timestamp">04:12</span><span><i id="1" class="fa-solid songItemplay fa-play"></i></span></span>
                </div>
                <div class="songItem">
                    <img src="./img/chemttrailcover.jpg" alt="cover image">
                    <span>Chemtrails</span> <!--  to get in one line -->
                    <span class="songlistPlay"><span class="timestamp">06:54</span><span><i id="2" class="fa-solid songItemplay fa-play"></i></span></span>
                </div>
                <div class="songItem">
                    <img src="./img/aboutyoucover.jpg" alt="cover image">
                    <span>About You</span> <!--  to get in one line -->
                    <span class="songlistPlay"><span class="timestamp">05:25</span><span><i id="3" class="fa-solid songItemplay fa-play"></i></span></span>
                </div>
                <div class="songItem">
                    <img src="./img/reflectioncover.jpg" alt="cover image">
                    <span>Reflections</span> <!--  to get in one line -->
                    <span class="songlistPlay"><span class="timestamp">04:04</span><span><i id="4" class="fa-solid songItemplay fa-play"></i></span></span>
                </div>

            </div>
            </div>
            
        </div>
        <div class="songBanner"></div>
    </div>

    <div class="bottom">
        <!-- <input type="range" name="range" id="myProgressbar" min="0" max="100"> -->
        <div class="controls">
          <input type="range" name="range" id="myProgressbar" min="0" value="0" max="100"> 
            <div class="icons">
                <i id="previous" class="fa-solid fa-backward fa-2x" ></i>
                <i class="fa-solid fa-play fa-2x" id="nowPlaying"></i>
                <i id="next" class="fa-solid fa-forward fa-2x"></i>
            </div>
        </div>

    </div>


    <!-- <script src="https://kit.fontawesome.com/ac0d9f6c12.js" crossorigin="anonymous"></script> -->
    <script src="index.js"></script>
</body>

</html>
